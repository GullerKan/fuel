<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Топливо</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
  }
  #messages {
    margin-bottom: 20px;
    font-weight: bold;
  }
  #fuel-container {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .fuel-box {
    width: 150px;
    height: 50px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    border-radius: 5px;
    color: #fff;
  }
  .available {
    background-color: green;
  }
  .out_of_stock {
    background-color: red;
  }
</style>
</head>
<body>

<h2>Информация о топливе</h2>

<label for="interval">Обновлять каждые  
  <input type="number" id="interval" min="1" max="3600" value="10" /> секунд
</label>
<button id="startBtn">Запустить обновление</button>
<button id="stopBtn">Остановить</button>

<div id="messages"></div>
<div id="fuel-container"></div>

<script>
const container = document.getElementById('fuel-container');
const messageDiv = document.getElementById('messages');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const intervalInput = document.getElementById('interval');

let timerId = null;

const allFuelTypes = [
  { code: "dt", title: "ДТ" },
  { code: "dt_plus", title: "ДТ+" },
  { code: "a92", title: "А92" },
  { code: "a95", title: "А95" },
  { code: "a95_plus", title: "A95+" }
];

function fetchFuelData() {
  fetch('https://fuel.sevtech.org/fuel/qr/fuel-types')
    .then(res => res.json())
    .then(data => {
      if (data.status !== "ok" || !data.data) {
        messageDiv.textContent = "Ошибка получения данных.";
        container.innerHTML = "";
        return;
      }
      ч
      const { fuel_types, out_of_stock_message } = data.data;
      
      if (!fuel_types || fuel_types.length === 0) {
        messageDiv.textContent = out_of_stock_message;
        container.innerHTML = "";
        return;
      }
      
      messageDiv.textContent = "";
      container.innerHTML = "";
      
      // Создаем массив кодов топлив для быстрого поиска
      const fuelCodes = new Set(fuel_types.map(f => f.code));
      
      // Для каждого вида топлива
      allFuelTypes.forEach(fType => {
        const fuelExist = fuelCodes.has(fType.code);
        const isAvailable = fuelExist;
        
        const box = document.createElement('div');
        box.className = 'fuel-box';
        // Если топлива есть, то зеленый, иначе красный
        if (isAvailable) {
          box.classList.add('available');
          box.textContent = fType.title;
        } else {
          box.classList.add('out_of_stock');
          box.textContent = fType.title + ' закончился';
        }
        container.appendChild(box);
      });
    })
    .catch(() => {
      messageDiv.textContent = "Ошибка при запросе данных.";
      container.innerHTML = "";
    });
}

function startUpdating() {
  if (timerId) clearInterval(timerId);
  fetchFuelData(); // сразу
  const intervalSec = parseInt(intervalInput.value, 10);
  timerId = setInterval(fetchFuelData, intervalSec * 1000);
}

function stopUpdating() {
  if (timerId) {
    clearInterval(timerId);
    timerId = null;
  }
}

document.getElementById('startBtn').addEventListener('click', startUpdating);
document.getElementById('stopBtn').addEventListener('click', stopUpdating);

// Запускаем по умолчанию
startUpdating();
</script>

</body>
</html>
